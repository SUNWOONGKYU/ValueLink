<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValueLink - AI 기반 기업가치평가 플랫폼</title>
  <style>
    /* ── Reset + Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

    /* ── Theme Variables (원본 PPTX 색상) ── */
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #334155;
      --muted: #64748b;
      --accent: #1e40af;
      --accent2: #3b82f6;
      --code-bg: #f1f5f9;
      --slide-max-w: 1100px;
    }
    :root.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #a78bfa;
      --code-bg: #1e293b;
    }

    body { background: var(--bg); color: var(--text); }

    /* ── Progress Bar ── */
    .progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); z-index: 100; transition: width 0.3s ease; width: 100%; }

    /* ── Slide Container ── */
    .slides { position: relative; width: 100%; height: 100vh; }
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
      padding: 40px 48px 60px;
      opacity: 1;
      overflow-y: auto;
    }
    .slide-inner {
      max-width: var(--slide-max-w); width: 100%;
    }

    /* ── Typography ── */
    .slide h1 { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 900; margin-bottom: 12px; line-height: 1.2; color: var(--accent); text-align: center; }
    .slide .subtitle { font-size: 1.2rem; color: var(--muted); margin-bottom: 32px; text-align: center; }
    .slide h2 { font-size: 1.5rem; font-weight: 800; margin-top: 32px; margin-bottom: 16px; color: var(--accent); }
    .slide h3 { font-size: 1.2rem; color: var(--text); margin-top: 24px; margin-bottom: 12px; font-weight: 700; }
    .slide p { font-size: 1rem; line-height: 1.7; color: var(--text); margin-bottom: 12px; }
    .slide ul, .slide ol { font-size: 1rem; line-height: 1.8; padding-left: 24px; color: var(--text); margin-bottom: 16px; }
    .slide li { margin-bottom: 6px; }
    .slide li::marker { color: var(--accent); }
    .slide strong { color: var(--accent); font-weight: 700; }

    /* ── Highlight Box ── */
    .highlight { background: linear-gradient(135deg, rgba(30,64,175,0.08), rgba(59,130,246,0.08)); border-left: 4px solid var(--accent); padding: 14px 18px; border-radius: 0 10px 10px 0; margin: 20px 0; }

    /* ── Line Separator ── */
    hr { border: none; height: 1px; background: linear-gradient(to right, transparent, var(--accent), transparent); margin: 24px 0; opacity: 0.3; }

    /* ── Theme Toggle ── */
    .theme-toggle { position: fixed; top: 12px; right: 12px; z-index: 100; background: var(--surface); border: 1px solid rgba(148,163,184,0.2); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    .fs-toggle { position: fixed; top: 12px; right: 80px; z-index: 100; background: var(--surface); border: 1px solid rgba(148,163,184,0.2); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

    /* ── Print ── */
    @media print {
      .theme-toggle, .fs-toggle, .progress { display: none !important; }
      .slide { overflow-y: visible; }
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .slide { padding: 30px 20px 50px; }
    }
  </style>
</head>
<body>

<div class="progress" id="progress"></div>
<button class="fs-toggle" id="fsToggle" title="전체화면 (F)">⛶</button>
<button class="theme-toggle" id="themeToggle">Dark</button>

<div class="slides" id="slides">

  <div class="slide">
    <div class="slide-inner">

      <h1>ValueLink</h1>
      <div class="subtitle">AI 기반 기업가치평가 플랫폼</div>

      <hr>

      <h2>메인 서비스: Valuation (기업가치평가)</h2>

      <div class="highlight">
        <p style="font-size:1.1rem;margin:0;font-weight:700;color:var(--accent);">AI 자동화 시스템 구현</p>
        <p style="font-size:1.05rem;margin-top:8px;"><strong>48시간 내 작성 완료</strong> &nbsp;|&nbsp; <strong>💰 기존 비용의 절반 이하</strong></p>
      </div>

      <h3>5가지 평가법</h3>
      <ul>
        <li>DCF 평가법</li>
        <li>상대가치 평가법</li>
        <li>본질가치 평가법</li>
        <li>자산가치 평가법</li>
        <li>상증세법 평가법</li>
      </ul>

      <hr>

      <h2>부대 서비스</h2>
      <ul>
        <li><strong>Link</strong> - 평가 완료 기업과 투자자·서포터 연결</li>
        <li><strong>Deals</strong> - 최신 벤처 투자 뉴스 수집 및 제공</li>
      </ul>

      <div style="text-align:center;margin-top:40px;padding-top:32px;border-top:2px solid rgba(30,64,175,0.15);">
        <a href="https://sunwoongkyu.github.io/ValueLink/Valuation_Company/valuation-platform/frontend/index.html"
           target="_blank"
           style="display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#ffffff;padding:14px 36px;border-radius:30px;text-decoration:none;font-weight:700;font-size:1.1rem;box-shadow:0 4px 12px rgba(30,64,175,0.25);transition:transform 0.2s,box-shadow 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 16px rgba(30,64,175,0.35)';"
           onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 12px rgba(30,64,175,0.25)';">
          🚀 ValueLink 플랫폼 바로가기
        </a>
      </div>

    </div>
  </div>

</div>

<script>
function toggleFS() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFS();
});

document.getElementById('themeToggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  document.getElementById('themeToggle').textContent = document.documentElement.classList.contains('dark') ? 'Light' : 'Dark';
});
document.getElementById('fsToggle').addEventListener('click', toggleFS);
</script>
</body>
</html>
