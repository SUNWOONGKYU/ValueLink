<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueLink - 투자 평가 플랫폼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;
            background: #1F2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .slideshow-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slide.active {
            display: flex;
            opacity: 1;
        }

        .slide-content {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .slide-left {
            flex: 1;
            padding: 35px 40px;
            background: linear-gradient(135deg, #f0f9ff 0%, #ecfdf5 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-right {
            flex: 1;
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-title {
            font-size: 42px;
            font-weight: 800;
            color: #1E40AF;
            margin-bottom: 8px;
        }

        .slide-subtitle {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 12px;
        }

        .content-section {
            margin-bottom: 14px;
        }

        .content-label {
            font-size: 13px;
            font-weight: 700;
            color: #1E40AF;
            margin-bottom: 6px;
        }

        .content-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }

        .highlight-text {
            background: #FEF3C7;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            margin: 8px 0;
            border-left: 3px solid #F59E0B;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #1E40AF;
            margin-top: 14px;
            margin-bottom: 8px;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-list li {
            padding: 4px 0;
            padding-left: 16px;
            position: relative;
            font-size: 13px;
            color: #333;
            line-height: 1.35;
        }

        .item-list li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #1E40AF;
            font-weight: bold;
        }

        .service-item {
            padding: 5px 0;
            font-size: 13px;
            color: #333;
            line-height: 1.35;
        }

        .slide-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .slide-image img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* 네비게이션 */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 60px;
            height: 60px;
            border: none;
            background: rgba(30, 64, 175, 0.7);
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            background: rgba(30, 64, 175, 0.95);
            transform: translateY(-50%) scale(1.1);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        /* 인디케이터 */
        .indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(30, 64, 175, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: #1E40AF;
            width: 30px;
            border-radius: 6px;
        }

        .dot:hover {
            background: rgba(30, 64, 175, 0.8);
        }

        /* 카운터 */
        .slide-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 64, 175, 0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 5;
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .slide-left {
                padding: 30px 30px;
            }

            .slide-right {
                padding: 30px 30px;
            }

            .slide-title {
                font-size: 36px;
            }

            .slide-subtitle {
                font-size: 14px;
            }

            .content-label {
                font-size: 12px;
            }

            .content-text {
                font-size: 13px;
            }

            .item-list li {
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .slideshow-container {
                aspect-ratio: auto;
                min-height: 600px;
            }

            .slide-content {
                flex-direction: column;
            }

            .slide-left {
                padding: 20px;
            }

            .slide-right {
                padding: 20px;
            }

            .slide-title {
                font-size: 28px;
            }

            .slide-subtitle {
                font-size: 12px;
            }

            .nav-button {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="slideshow-wrapper">
        <div class="slideshow-container">
            <!-- 슬라이드 1 -->
            <div class="slide active">
                <div class="slide-content">
                    <div class="slide-left">
                        <div class="slide-title">ValueLink</div>
                        <div class="slide-subtitle">AI 기반 기업가치평가 플랫폼</div>

                        <div class="content-section">
                            <div class="content-label">메인 서비스</div>
                            <div class="content-text">Valuation (기업가치평가)</div>
                        </div>

                        <div class="content-section">
                            <div class="content-label">핵심 기능</div>
                            <div class="content-text">AI 자동화 시스템 구현</div>
                        </div>

                        <div class="highlight-text">
                            48시간 내 작성 완료  |  💰 기존 비용의 절반 이하
                        </div>

                        <div class="section-title">5가지 평가법</div>
                        <ul class="item-list">
                            <li>DCF 평가법</li>
                            <li>상대가치 평가법</li>
                            <li>본질가치 평가법</li>
                            <li>자산가치 평가법</li>
                            <li>상증세법 평가법</li>
                        </ul>

                        <div class="section-title">부대 서비스</div>
                        <div class="service-item">• Link - 기업과 투자자·서포터 연결</div>
                        <div class="service-item">• Deals - 벤처 투자 뉴스 수집</div>
                    </div>

                    <div class="slide-right">
                        <div class="slide-image">
                            <img src="valuelink-screenshot.jpg" alt="ValueLink 플랫폼">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 네비게이션 -->
            <button class="nav-button prev" onclick="changeSlide(-1)">❮</button>
            <button class="nav-button next" onclick="changeSlide(1)">❯</button>

            <!-- 인디케이터 -->
            <div class="indicators">
                <div class="dot active" onclick="currentSlide(0)"></div>
            </div>

            <!-- 카운터 -->
            <div class="slide-counter">
                <span id="current">1</span> / <span id="total">1</span>
            </div>
        </div>
    </div>

    <script>
        let slideIndex = 0;
        const totalSlides = 1;

        function changeSlide(n) {
            slideIndex += n;
            if (slideIndex >= totalSlides) slideIndex = 0;
            if (slideIndex < 0) slideIndex = totalSlides - 1;
            showSlide(slideIndex);
        }

        function currentSlide(n) {
            slideIndex = n;
            showSlide(slideIndex);
        }

        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            slides[n].classList.add('active');
            dots[n].classList.add('active');

            document.getElementById('current').textContent = n + 1;
        }

        // 키보드 네비게이션
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === ' ') {
                e.preventDefault();
                changeSlide(1);
            }
        });

        // 초기화
        showSlide(0);
    </script>
</body>
</html>
