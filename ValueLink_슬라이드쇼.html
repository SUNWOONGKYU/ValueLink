<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueLink 투자 평가 플랫폼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1E40AF 0%, #0F766E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .left-section {
            padding: 60px 50px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section {
            background: linear-gradient(135deg, #1E40AF 0%, #0F766E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .screenshot {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            color: #1E40AF;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 24px;
            color: #0F766E;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .features {
            list-style: none;
            margin-bottom: 30px;
        }

        .features li {
            padding: 12px 0;
            padding-left: 30px;
            position: relative;
            font-size: 16px;
            color: #1F2937;
            line-height: 1.6;
        }

        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #0F766E;
            font-weight: bold;
            font-size: 20px;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #1E40AF, #0F766E);
            color: white;
            padding: 16px 40px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #E5E7EB;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #1E40AF;
        }

        .stat-label {
            font-size: 13px;
            color: #6B7280;
            margin-top: 5px;
        }

        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
            }

            .right-section {
                min-height: 300px;
            }

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 20px;
            }

            .left-section {
                padding: 40px 30px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .features li {
                font-size: 14px;
            }

            .left-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>ValueLink</h1>
            <div class="subtitle">투자 평가 플랫폼</div>

            <ul class="features">
                <li><strong>AI 기반 가치평가</strong> - DCF, 비교분석, 시뮬레이션</li>
                <li><strong>Real-time Deal 분석</strong> - 투자 뉴스 자동 수집</li>
                <li><strong>전문가 협업</strong> - 투자자, 창업가, 회계사 협력</li>
                <li><strong>AI Q&A 시스템</strong> - 투자 관련 질문 즉시 답변</li>
                <li><strong>Risk Assessment</strong> - 자동 위험 요소 분석</li>
            </ul>

            <button class="cta-button">지금 시작하기</button>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number">32</span>
                    <span class="stat-label">Tasks</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">95</span>
                    <span class="stat-label">Files</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">5</span>
                    <span class="stat-label">Stages</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">100%</span>
                    <span class="stat-label">Coverage</span>
                </div>
            </div>
        </div>

        <div class="right-section">
            <img src="valuelink-screenshot.jpg" alt="ValueLink 플랫폼" class="screenshot">
        </div>
    </div>
</body>
</html>
