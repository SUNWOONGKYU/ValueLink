<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueLink - 투자 평가 플랫폼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;
            background: #1F2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .slideshow-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slide.active {
            display: flex;
            opacity: 1;
        }

        .slide-content {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .slide-info {
            flex: 1;
            padding: 60px 50px;
            background: linear-gradient(135deg, #1E40AF 0%, #0F766E 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-info h1 {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .slide-info h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #F0F9FF;
            line-height: 1.4;
        }

        .slide-features {
            list-style: none;
            margin-top: 30px;
        }

        .slide-features li {
            padding: 12px 0;
            padding-left: 30px;
            position: relative;
            font-size: 16px;
            line-height: 1.6;
            color: #F0F9FF;
        }

        .slide-features li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #60A5FA;
            font-size: 20px;
        }

        .slide-image {
            flex: 1;
            background: #F9FAFB;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .slide-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* 네비게이션 */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 60px;
            height: 60px;
            border: none;
            background: rgba(30, 64, 175, 0.7);
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            background: rgba(30, 64, 175, 0.95);
            transform: translateY(-50%) scale(1.1);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        /* 인디케이터 */
        .indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(30, 64, 175, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: #1E40AF;
            width: 30px;
            border-radius: 6px;
        }

        .dot:hover {
            background: rgba(30, 64, 175, 0.8);
        }

        /* 카운터 */
        .slide-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 64, 175, 0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 5;
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .slide-info {
                flex: 0.8;
                padding: 40px 30px;
            }

            .slide-info h1 {
                font-size: 40px;
            }

            .slide-info h2 {
                font-size: 22px;
            }

            .slide-features li {
                font-size: 14px;
            }
        }

        @media (max-width: 768px) {
            .slideshow-container {
                aspect-ratio: auto;
                min-height: 600px;
            }

            .slide-content {
                flex-direction: column;
            }

            .slide-info {
                flex: 1;
                padding: 30px 20px;
                min-height: 300px;
            }

            .slide-image {
                flex: 1;
                min-height: 300px;
                padding: 20px;
            }

            .slide-info h1 {
                font-size: 32px;
            }

            .slide-info h2 {
                font-size: 18px;
            }

            .nav-button {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="slideshow-wrapper">
        <div class="slideshow-container">
            <!-- 슬라이드 1 -->
            <div class="slide active">
                <div class="slide-content">
                    <div class="slide-info">
                        <h1>ValueLink</h1>
                        <h2>AI 기반 투자평가 플랫폼</h2>
                        <ul class="slide-features">
                            <li><strong>투자의사결정:</strong> 데이터 기반 의사결정</li>
                            <li><strong>기업가치 분석:</strong> 정밀한 가치 평가</li>
                            <li><strong>정량적 평가:</strong> 객관적 수치 분석</li>
                            <li><strong>AI 자동화:</strong> 시스템 활용</li>
                            <li><strong>시간 단축:</strong> 48시간 내 작성 완료</li>
                            <li><strong>비용 절감:</strong> 효율적인 프로세스</li>
                        </ul>
                    </div>
                    <div class="slide-image">
                        <img src="valuelink-screenshot.jpg" alt="ValueLink 플랫폼">
                    </div>
                </div>
            </div>

            <!-- 네비게이션 -->
            <button class="nav-button prev" onclick="changeSlide(-1)">❮</button>
            <button class="nav-button next" onclick="changeSlide(1)">❯</button>

            <!-- 인디케이터 -->
            <div class="indicators">
                <div class="dot active" onclick="currentSlide(0)"></div>
            </div>

            <!-- 카운터 -->
            <div class="slide-counter">
                <span id="current">1</span> / <span id="total">1</span>
            </div>
        </div>
    </div>

    <script>
        let slideIndex = 0;
        const totalSlides = 1;

        function changeSlide(n) {
            slideIndex += n;
            if (slideIndex >= totalSlides) slideIndex = 0;
            if (slideIndex < 0) slideIndex = totalSlides - 1;
            showSlide(slideIndex);
        }

        function currentSlide(n) {
            slideIndex = n;
            showSlide(slideIndex);
        }

        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            slides[n].classList.add('active');
            dots[n].classList.add('active');

            document.getElementById('current').textContent = n + 1;
        }

        // 키보드 네비게이션
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === ' ') {
                e.preventDefault();
                changeSlide(1);
            }
        });

        // 초기화
        showSlide(0);
    </script>
</body>
</html>
