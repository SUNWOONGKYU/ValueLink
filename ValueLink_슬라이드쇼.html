<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueLink - 투자 평가 플랫폼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif;
            background: #1F2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .slideshow-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slide.active {
            display: flex;
            opacity: 1;
        }

        .slide-content {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            padding: 40px 50px;
            background: white;
            color: #333;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .slide-title {
            font-size: 48px;
            font-weight: 800;
            color: #1E40AF;
            margin-bottom: 10px;
            text-align: center;
        }

        .slide-subtitle {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1E40AF;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .highlight-box {
            background: #E0F2FE;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }

        .section-list {
            list-style: none;
            margin: 15px 0 0 0;
            padding-left: 0;
        }

        .section-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
            font-size: 15px;
            color: #333;
            line-height: 1.5;
        }

        .section-list li:before {
            content: "•";
            position: absolute;
            left: 5px;
            color: #1E40AF;
            font-size: 18px;
        }

        .slide-image {
            margin-top: auto;
            text-align: right;
            padding-top: 20px;
        }

        .slide-image img {
            max-height: 200px;
            object-fit: contain;
        }

        /* 네비게이션 */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 60px;
            height: 60px;
            border: none;
            background: rgba(30, 64, 175, 0.7);
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            background: rgba(30, 64, 175, 0.95);
            transform: translateY(-50%) scale(1.1);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        /* 인디케이터 */
        .indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(30, 64, 175, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: #1E40AF;
            width: 30px;
            border-radius: 6px;
        }

        .dot:hover {
            background: rgba(30, 64, 175, 0.8);
        }

        /* 카운터 */
        .slide-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 64, 175, 0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 5;
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .slide-content {
                padding: 30px;
            }

            .slide-title {
                font-size: 36px;
            }

            .slide-subtitle {
                font-size: 16px;
            }

            .section-title {
                font-size: 16px;
            }

            .section-list li {
                font-size: 14px;
            }
        }

        @media (max-width: 768px) {
            .slideshow-container {
                aspect-ratio: auto;
                min-height: 600px;
            }

            .slide-content {
                padding: 20px;
            }

            .slide-title {
                font-size: 28px;
            }

            .slide-subtitle {
                font-size: 14px;
            }

            .nav-button {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="slideshow-wrapper">
        <div class="slideshow-container">
            <!-- 슬라이드 1 -->
            <div class="slide active">
                <div class="slide-content">
                    <div class="slide-title">ValueLink</div>
                    <div class="slide-subtitle">AI 기반 깃원가치평가 플랫폼</div>

                    <div class="section-title">메인 서비스: Valuation (깃원가치평가)</div>

                    <div class="highlight-box">
                        <strong>AI 자동화 시스템 구현</strong><br>
                        48시간 내 작성 완료 | 6가지 비용의 절반 이하
                    </div>

                    <div class="section-title">5가지 평가법</div>
                    <ul class="section-list">
                        <li>DCF 평가법</li>
                        <li>상대가치 평가법</li>
                        <li>분할가치 평가법</li>
                        <li>자산가치 평가법</li>
                        <li>상중성분 평가법</li>
                    </ul>

                    <div class="section-title">부대 서비스</div>
                    <ul class="section-list">
                        <li>Link (평가 완료 기업과 투자자·서포트 연결)</li>
                        <li>Deals (최신 벤처 투자 뉴스 수집 및 제공)</li>
                    </ul>

                    <div class="slide-image">
                        <img src="valuelink-screenshot.jpg" alt="ValueLink 플랫폼">
                    </div>
                </div>
            </div>

            <!-- 네비게이션 -->
            <button class="nav-button prev" onclick="changeSlide(-1)">❮</button>
            <button class="nav-button next" onclick="changeSlide(1)">❯</button>

            <!-- 인디케이터 -->
            <div class="indicators">
                <div class="dot active" onclick="currentSlide(0)"></div>
            </div>

            <!-- 카운터 -->
            <div class="slide-counter">
                <span id="current">1</span> / <span id="total">1</span>
            </div>
        </div>
    </div>

    <script>
        let slideIndex = 0;
        const totalSlides = 1;

        function changeSlide(n) {
            slideIndex += n;
            if (slideIndex >= totalSlides) slideIndex = 0;
            if (slideIndex < 0) slideIndex = totalSlides - 1;
            showSlide(slideIndex);
        }

        function currentSlide(n) {
            slideIndex = n;
            showSlide(slideIndex);
        }

        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            slides[n].classList.add('active');
            dots[n].classList.add('active');

            document.getElementById('current').textContent = n + 1;
        }

        // 키보드 네비게이션
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === ' ') {
                e.preventDefault();
                changeSlide(1);
            }
        });

        // 초기화
        showSlide(0);
    </script>
</body>
</html>
