<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals Test - ValueLink</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        #status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        #status.loading { background: #e3f2fd; color: #1976d2; }
        #status.success { background: #e8f5e9; color: #388e3c; }
        #status.error { background: #ffebee; color: #d32f2f; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: bold; }
        tr:hover { background: #f9f9f9; }
        .count { font-size: 18px; font-weight: bold; color: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deals Data Test</h1>
        <div id="status" class="loading">Loading deals from Supabase...</div>
        <div>Total Records: <span class="count" id="count">0</span></div>
        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Stage</th>
                    <th>Amount</th>
                    <th>Investor</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="deals-tbody">
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://arxrfetgaitkgiiqabap.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyeHJmZXRnYWl0a2dpaXFhYmFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3ODk1OTgsImV4cCI6MjA4NDM2NTU5OH0.BTnuv0sYr2MGe1c-gk8PWCviwkFyIiymfKp5Jhzwbo0';

        async function loadDeals() {
            const status = document.getElementById('status');
            const tbody = document.getElementById('deals-tbody');
            
            try {
                console.log('Fetching deals...');
                status.textContent = 'Fetching from Supabase...';
                status.className = 'loading';
                
                const response = await fetch(`${SUPABASE_URL}/rest/v1/deals?select=*&order=news_date.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const deals = await response.json();
                console.log('Deals loaded:', deals.length);
                
                document.getElementById('count').textContent = deals.length;
                
                if (deals.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No deals found</td></tr>';
                    status.textContent = '✅ Connected but no deals found';
                    status.className = 'error';
                    return;
                }

                tbody.innerHTML = deals.slice(0, 50).map(deal => `
                    <tr>
                        <td>${deal.company_name || '-'}</td>
                        <td>${deal.stage || '-'}</td>
                        <td>${deal.amount || '-'}억</td>
                        <td>${deal.investors || '-'}</td>
                        <td>${deal.news_date || '-'}</td>
                    </tr>
                `).join('');

                status.textContent = `✅ Success! Loaded ${deals.length} deals`;
                status.className = 'success';
            } catch (error) {
                console.error('Error:', error);
                status.textContent = `❌ Error: ${error.message}`;
                status.className = 'error';
                tbody.innerHTML = `<tr><td colspan="5">Error loading deals</td></tr>`;
            }
        }

        // Load on page load
        window.addEventListener('DOMContentLoaded', loadDeals);
        // Also try immediately
        loadDeals();
    </script>
</body>
</html>
