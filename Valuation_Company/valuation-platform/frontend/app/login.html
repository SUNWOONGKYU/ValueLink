<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ValueLink</title>
    <!-- 모바일 최적화 CSS -->
    <link rel="stylesheet" href="styles/mobile-optimize.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --deep-blue: #1D4ED8;
            --deep-blue-light: #3B82F6;
            --deep-blue-pale: #DBEAFE;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6B7280;
            --bg-light: #F3F4F6;
            --white: #FFFFFF;
            --border: #E5E7EB;
            --error: #EF4444;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-light);
            margin: 0;
            padding: 0;
        }

        .login-wrapper {
            background: linear-gradient(135deg, var(--deep-blue) 0%, #1E40AF 100%);
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--deep-blue) 0%, #1E40AF 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--deep-blue);
            box-shadow: 0 0 0 3px var(--deep-blue-pale);
        }

        .error-message {
            font-size: 13px;
            color: var(--error);
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            width: auto;
        }

        .forgot-password {
            color: var(--deep-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: var(--deep-blue);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: #1E40AF;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            position: relative;
            background: var(--white);
            padding: 0 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .register-link a {
            color: var(--deep-blue);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* 비밀번호 찾기 모달 */
        .pw-reset-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .pw-reset-overlay.active { display: flex; }
        .pw-reset-box {
            background: white;
            border-radius: 16px;
            padding: 36px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .pw-reset-box h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .pw-reset-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .pw-reset-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .pw-reset-box input:focus {
            outline: none;
            border-color: var(--deep-blue);
        }
        .pw-reset-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .pw-reset-actions button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-pw-send {
            background: var(--deep-blue);
            color: white;
        }
        .btn-pw-send:hover { background: #1E40AF; }
        .btn-pw-cancel {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .btn-pw-cancel:hover { background: #E5E7EB; }
        .pw-reset-msg {
            font-size: 13px;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
        }
        .pw-reset-msg.success {
            background: #DCFCE7;
            color: #059669;
            display: block;
        }
        .pw-reset-msg.error {
            background: #FEE2E2;
            color: #DC2626;
            display: block;
        }

        /* 비밀번호 재설정 입력 모달 */
        .pw-new-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .pw-new-overlay.active { display: flex; }
        .pw-new-box {
            background: white;
            border-radius: 16px;
            padding: 36px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .pw-new-box h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .pw-new-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .pw-new-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .pw-new-box input:focus {
            outline: none;
            border-color: var(--deep-blue);
        }
        .pw-new-msg {
            font-size: 13px;
            margin-top: 8px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
        }
        .pw-new-msg.success { background: #DCFCE7; color: #059669; display: block; }
        .pw-new-msg.error { background: #FEE2E2; color: #DC2626; display: block; }

        @media (max-width: 768px) {
            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 공통 헤더 -->
    <div id="header-container"></div>

    <div class="login-wrapper">
    <div class="container">
        <!-- 로그인 카드 헤더 -->
        <div class="login-header">
            <h1>ValueLink 로그인</h1>
            <p>프로젝트 평가 플랫폼</p>
        </div>

        <!-- 폼 -->
        <div class="form-container">
            <form id="loginForm">
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-options">
                    <span></span>
                    <a href="#" class="forgot-password" onclick="openPwReset(event)">비밀번호 찾기</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">로그인</button>
            </form>

            <div class="divider">
                <span>또는</span>
            </div>

            <div class="register-link">
                계정이 없으신가요? <a href="register.html">회원가입</a>
            </div>
        </div>
    </div>
    </div> <!-- /login-wrapper -->

    <!-- 비밀번호 찾기 모달 -->
    <div class="pw-reset-overlay" id="pwResetOverlay">
        <div class="pw-reset-box">
            <h2>비밀번호 찾기</h2>
            <p>가입하신 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>
            <input type="email" id="pwResetEmail" placeholder="example@email.com" autocomplete="email">
            <div class="pw-reset-actions">
                <button class="btn-pw-cancel" onclick="closePwReset()">취소</button>
                <button class="btn-pw-send" onclick="sendPwReset()">이메일 전송</button>
            </div>
            <div class="pw-reset-msg" id="pwResetMsg"></div>
        </div>
    </div>

    <!-- 새 비밀번호 입력 모달 (recovery 링크로 돌아왔을 때 표시) -->
    <div class="pw-new-overlay" id="pwNewOverlay">
        <div class="pw-new-box">
            <h2>새 비밀번호 설정</h2>
            <p>새로 사용할 비밀번호를 입력해주세요.<br>8자 이상, 영문과 숫자를 포함해야 합니다.</p>
            <input type="password" id="pwNewPassword" placeholder="새 비밀번호 (8자 이상, 영문+숫자)" autocomplete="new-password">
            <input type="password" id="pwNewPasswordConfirm" placeholder="새 비밀번호 확인" autocomplete="new-password">
            <div class="pw-reset-actions">
                <button class="btn-pw-send" onclick="submitNewPassword()">비밀번호 변경</button>
            </div>
            <div class="pw-new-msg" id="pwNewMsg"></div>
        </div>
    </div>

    <!-- 헤더 로드 -->
    <script>
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
                const scripts = document.getElementById('header-container').querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => console.error('헤더 로드 실패:', error));
    </script>

    <script>
        // Supabase 초기화
        let supabaseClient = null;
        try {
            const SUPABASE_URL = 'https://arxrfetgaitkgiiqabap.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyeHJmZXRnYWl0a2dpaXFhYmFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3ODk1OTgsImV4cCI6MjA4NDM2NTU5OH0.BTnuv0sYr2MGe1c-gk8PWCviwkFyIiymfKp5Jhzwbo0';
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) { console.warn('Supabase 초기화 스킵 - 페이지 정상 작동'); }

        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // 에러 메시지 초기화
            hideError('emailError');
            hideError('passwordError');

            // 버튼 비활성화
            loginBtn.disabled = true;
            loginBtn.textContent = '로그인 중...';

            try {
                // Supabase Auth 로그인
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                console.log('Login success:', data.user.email);

                // users 테이블에서 역할 조회
                let { data: userData, error: userError } = await supabaseClient
                    .from('users')
                    .select('role, is_active')
                    .eq('user_id', data.user.id)
                    .single();

                // 가입 시 이메일 확인이 필요했던 계정: 첫 로그인 시점에
                // register.html이 보류 저장(vl_pending_profile)한 프로필을 DB에 기록
                if (userError && userError.code === 'PGRST116') {
                    userData = await completePendingRegistration(data.user, email);
                    userError = null;
                }

                if (userError) {
                    console.error('User data fetch error:', userError);
                    throw new Error('사용자 정보를 가져올 수 없습니다');
                }

                // 계정 활성화 여부 확인
                if (!userData.is_active) {
                    await supabaseClient.auth.signOut();
                    throw new Error('비활성화된 계정입니다. 관리자에게 문의하세요.');
                }

                // 역할별 리다이렉트
                const role = userData.role;
                console.log('User role:', role);

                // 역할을 localStorage에 저장 (사이드바 + 내부 페이지에서 즉시 인식)
                localStorage.setItem('userRole', role);
                localStorage.setItem('userEmail', email);
                localStorage.removeItem('loggedOut');

                // 사용자 이름 조회 및 저장
                const { data: profileData } = await supabaseClient
                    .from('users')
                    .select('name')
                    .eq('user_id', data.user.id)
                    .single();
                const userName = (profileData && profileData.name) || email.split('@')[0];
                localStorage.setItem('userName', userName);

                switch (role) {
                    case 'customer':
                        window.location.href = 'core/mypage.html';
                        break;
                    case 'accountant':
                        window.location.href = 'core/mypage.html';
                        break;
                    case 'admin':
                        window.location.href = 'core/mypage.html';
                        break;
                    default:
                        window.location.href = './';
                        break;
                }

            } catch (error) {
                console.error('Login error:', error);

                // 에러 메시지 표시
                if (error.message.includes('Invalid login credentials')) {
                    showError('passwordError', '이메일 또는 비밀번호가 올바르지 않습니다');
                } else if (error.message.includes('Email not confirmed')) {
                    showError('emailError', '이메일 인증이 필요합니다. 이메일을 확인해주세요.');
                } else {
                    showError('passwordError', error.message);
                }

                // 버튼 활성화
                loginBtn.disabled = false;
                loginBtn.textContent = '로그인';
            }
        });

        // 이메일 확인 후 첫 로그인: 보류된 가입 프로필(users + customers)을 DB에 저장
        async function completePendingRegistration(user, email) {
            let pending = null;
            try {
                const raw = localStorage.getItem('vl_pending_profile');
                if (raw) pending = JSON.parse(raw);
            } catch (e) { /* 손상된 데이터는 무시 */ }

            // 이메일 비교는 대소문자 무시 (가입/로그인 입력 표기가 달라도 매칭)
            const emailLc = (email || '').toLowerCase();
            const pendingMatches = pending && (pending.email || '').toLowerCase() === emailLc;

            // 다른 기기에서 가입했거나 저장이 지워진 경우: 최소 정보로 계정 생성
            const name = (pendingMatches && pending.name) || email.split('@')[0];
            // 가입 허용 역할 화이트리스트 (RLS도 차단하지만 프론트에서도 한 번 더 — 명확한 UX)
            const ALLOWED_ROLES = ['customer', 'investor', 'partner', 'supporter'];
            let role = (pendingMatches && pending.role) || 'customer';
            if (!ALLOWED_ROLES.includes(role)) role = 'customer';

            const { error: userError } = await supabaseClient
                .from('users')
                .insert([{
                    user_id: user.id,
                    email: email,
                    name: name,
                    role: role,
                    is_active: true
                }]);
            if (userError) {
                console.error('Pending profile users insert error:', userError);
                // 세션만 살아있는 좀비 상태 방지 — 로그아웃 후 에러 안내
                await supabaseClient.auth.signOut();
                throw new Error('가입 정보 저장에 실패했습니다. 다시 로그인해주세요.');
            }

            if (role === 'customer' && pendingMatches && pending.customer) {
                const { error: custError } = await supabaseClient
                    .from('customers')
                    .insert([Object.assign({ user_id: user.id, email: email }, pending.customer)]);
                if (custError) {
                    // 회사 정보 실패는 로그인 자체를 막지 않음 (마이페이지에서 재등록 가능)
                    console.error('Pending customer insert error:', custError);
                    alert('로그인은 완료됐지만 회사 정보 저장에 실패했습니다.\n마이페이지에서 다시 입력해주세요.');
                }
            }

            localStorage.removeItem('vl_pending_profile');
            console.log('Pending registration completed:', role);
            return { role: role, is_active: true };
        }

        // 에러 표시/숨김
        function showError(id, message) {
            const errorEl = document.getElementById(id);
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError(id) {
            const errorEl = document.getElementById(id);
            errorEl.classList.remove('show');
        }

        // 비밀번호 찾기 모달
        function openPwReset(e) {
            if (e) e.preventDefault();
            document.getElementById('pwResetOverlay').classList.add('active');
            document.getElementById('pwResetEmail').value = document.getElementById('email').value || '';
            document.getElementById('pwResetMsg').className = 'pw-reset-msg';
            document.getElementById('pwResetMsg').textContent = '';
        }

        function closePwReset() {
            document.getElementById('pwResetOverlay').classList.remove('active');
        }

        async function sendPwReset() {
            const email = document.getElementById('pwResetEmail').value.trim();
            const msgEl = document.getElementById('pwResetMsg');
            msgEl.className = 'pw-reset-msg';

            if (!email) {
                msgEl.textContent = '이메일을 입력해주세요.';
                msgEl.classList.add('error');
                return;
            }

            const sendBtn = document.querySelector('.btn-pw-send');
            sendBtn.disabled = true;
            sendBtn.textContent = '전송 중...';

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: new URL('login.html', window.location.href).toString()
                });
                if (error) throw error;
                msgEl.textContent = '재설정 링크를 이메일로 발송했습니다. 이메일을 확인해주세요.';
                msgEl.classList.add('success');
            } catch (err) {
                msgEl.textContent = '발송 실패: ' + (err.message || '다시 시도해주세요.');
                msgEl.classList.add('error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '이메일 전송';
            }
        }

        // 오버레이 클릭 시 모달 닫기
        document.getElementById('pwResetOverlay').addEventListener('click', function(e) {
            if (e.target === this) closePwReset();
        });

        // ── 비밀번호 재설정: 새 비밀번호 입력 모달 ──────────────────────────────
        // Supabase recovery 링크는 URL fragment(#)에 access_token 등을 담아 돌아온다.
        // detectSessionInUrl:true(기본값)가 해시를 소비/제거하므로 checkAuth() 실행 시점에
        // window.location.hash가 이미 없을 수 있다.
        //
        // Race 방지 설계:
        //   - onAuthStateChange의 첫 번째 콜백(INITIAL_SESSION 또는 PASSWORD_RECOVERY)이
        //     resolve될 때까지 checkAuth의 리다이렉트를 보류한다.
        //   - authStateReady Promise를 공유하고 checkAuth는 이 Promise를 await한 뒤
        //     isRecoveryFlow를 확인한다.
        var isRecoveryFlow = false;
        var authStateReady; // onAuthStateChange 첫 콜백 이후 resolve
        var resolveAuthReady;
        authStateReady = new Promise(function(resolve) { resolveAuthReady = resolve; });

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                // recovery 세션이 수립됨 → 플래그 세팅 후 새 비밀번호 입력 모달 표시
                isRecoveryFlow = true;
                sessionStorage.setItem('vl_pw_recovery', '1');
                document.getElementById('pwNewOverlay').classList.add('active');
            }
            // 첫 번째 콜백(INITIAL_SESSION 포함)이 도착했음을 checkAuth에 알린다
            if (resolveAuthReady) {
                resolveAuthReady();
                resolveAuthReady = null;
            }
        });

        async function submitNewPassword() {
            const pw = document.getElementById('pwNewPassword').value;
            const pw2 = document.getElementById('pwNewPasswordConfirm').value;
            const msgEl = document.getElementById('pwNewMsg');
            msgEl.className = 'pw-new-msg';

            const hasLetter = /[a-zA-Z]/.test(pw);
            const hasDigit = /[0-9]/.test(pw);

            if (pw.length < 8 || !hasLetter || !hasDigit) {
                msgEl.textContent = '비밀번호는 8자 이상, 영문과 숫자를 포함해야 합니다.';
                msgEl.classList.add('error');
                return;
            }
            if (pw !== pw2) {
                msgEl.textContent = '비밀번호가 일치하지 않습니다.';
                msgEl.classList.add('error');
                return;
            }

            const btn = document.querySelector('#pwNewOverlay .btn-pw-send');
            btn.disabled = true;
            btn.textContent = '변경 중...';

            try {
                const { error } = await supabaseClient.auth.updateUser({ password: pw });
                if (error) throw error;
                msgEl.textContent = '비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.';
                msgEl.classList.add('success');
                btn.textContent = '완료';
                // 2초 후 모달 닫고 폼 초기화
                setTimeout(() => {
                    document.getElementById('pwNewOverlay').classList.remove('active');
                    document.getElementById('pwNewPassword').value = '';
                    document.getElementById('pwNewPasswordConfirm').value = '';
                    msgEl.className = 'pw-new-msg';
                    // recovery 플래그 정리
                    isRecoveryFlow = false;
                    sessionStorage.removeItem('vl_pw_recovery');
                    // recovery 세션 종료 후 로그인 유도
                    supabaseClient.auth.signOut();
                }, 2000);
            } catch (err) {
                msgEl.textContent = '변경 실패: ' + (err.message || '다시 시도해주세요.');
                msgEl.classList.add('error');
                btn.disabled = false;
                btn.textContent = '비밀번호 변경';
            }
        }

        // 이미 로그인된 경우 리다이렉트
        // (확인 메일 링크로 돌아와 세션이 자동 생성된 경우, 보류 프로필 저장을 먼저 완료)
        (async function checkAuth() {
            // onAuthStateChange 첫 콜백을 기다린 뒤 isRecoveryFlow를 확인한다.
            // 이 대기가 없으면 PASSWORD_RECOVERY 이벤트가 오기 전에 getUser()가 먼저
            // 완료되어 recovery 세션을 일반 로그인으로 오인하고 mypage로 리다이렉트할 수 있다.
            await authStateReady;

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            // recovery 링크로 돌아온 경우: onAuthStateChange가 PASSWORD_RECOVERY 처리하므로 여기서는 리다이렉트하지 않음
            // isRecoveryFlow는 위의 await 이후 확인하므로 race가 없다.
            const hash = window.location.hash;
            if (isRecoveryFlow || sessionStorage.getItem('vl_pw_recovery') || (hash && hash.includes('type=recovery'))) return;

            try {
                const { error: rowError } = await supabaseClient
                    .from('users')
                    .select('role')
                    .eq('user_id', user.id)
                    .single();

                if (rowError && rowError.code === 'PGRST116') {
                    // users 행 없음 → 보류 프로필 저장 후 진입
                    await completePendingRegistration(user, user.email);
                } else if (rowError) {
                    throw rowError;
                }

                console.log('Already logged in, redirecting...');
                window.location.href = 'core/mypage.html';
            } catch (e) {
                // 저장 실패 시 로그인 페이지에 머무름 (completePendingRegistration이 signOut 처리)
                console.error('checkAuth pending registration error:', e);
            }
        })();
    </script>
</body>
</html>
