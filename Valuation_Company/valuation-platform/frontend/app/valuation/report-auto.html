// ===== 계산 =====
function computeDCF(p){const ke=p.rf/100+p.beta*p.mrp/100+p.sizeP/100;const kdAt=p.kd/100*(1-p.tax/100);const sum=p.eW+p.dW,eW=p.eW/sum,dW=p.dW/sum;const wacc=eW*ke+dW*kdAt;const tg=p.tg/100;const rows=[];let pvSum=0,fcff=0;for(let i=0;i<5;i++){const nopat=p.ebit[i]*(1-p.tax/100);fcff=nopat+p.dep[i]-p.capex[i]-p.wc[i];const df=1/Math.pow(1+wacc,i+1);const pv=fcff*df;pvSum+=pv;rows.push({y:i+1,fcff,df,pv});}const tFcff=fcff*(1+tg),tv=tFcff/(wacc-tg),pvTv=tv/Math.pow(1+wacc,5);const op=pvSum+pvTv,ev=op+p.nonOp,eq=ev-p.debt,ps=eq/p.shares;return{ke,kdAt,eW,dW,wacc,tg,rows,tv,pvTv,pvSum,op,ev,eq,ps};}
function computeTax(p){const w=(p.income[2]+p.nontax[2]-p.tax[2])*1+(p.income[1]+p.nontax[1]-p.tax[1])*2+(p.income[0]+p.nontax[0]-p.tax[0])*3;const weighted=Math.max(0,w/6);const dr=p.disc/100;const profitPS=(weighted*1e6/dr)/p.shares;const net=p.assets-p.liab;const assetPS=net*1e6/p.shares;let fin=Math.floor((profitPS*(p.general?3:2)+assetPS*(p.general?2:3))/5);const floor=assetPS*0.8,floored=fin<floor;if(floored)fin=Math.floor(floor);return{weighted,profitPS,assetPS,net,fin,floor,floored};}
function computeIntrinsic(p){const avg=(p.income[0]+p.income[1]+p.income[2])/3;const incomeVal=Math.max(0,avg)/(p.cap/100);const psInc=incomeVal*1e6/p.shares,psAsset=p.nav*1e6/p.shares;const intrinsic=Math.round((psAsset*1+psInc*1.5)/2.5);return{avg,incomeVal,psInc,psAsset,intrinsic};}
function computeRelative(p){const m1=a=>parseFloat((a.reduce((x,y)=>x+y,0)/a.length).toFixed(1));const avgPer=m1(p.peers.map(r=>r[1])),avgPbr=m1(p.peers.map(r=>r[2])),avgEv=m1(p.peers.map(r=>r[4]));const ps=mc=>Math.round(mc*1e6/p.shares);const perPS=ps(p.ni*avgPer),pbrPS=ps(p.eq*avgPbr),evPS=ps(p.ebitda*avgEv-p.netDebt);const weighted=perPS*p.wPer/100+pbrPS*p.wPbr/100+evPS*p.wEvEbitda/100;const liq=Math.min(Math.max(p.liq,0),50)/100;const disc=Math.round(weighted*(1-liq));return{avgPer,avgPbr,avgEv,perPS,pbrPS,evPS,weighted:Math.round(weighted),disc,liq};}
function computeAsset(p){const A=p.assets.map(r=>[r[0],r[1],r[2],r[1]+r[2]]);const L=p.liabs.map(r=>[r[0],r[1],r[2],r[1]+r[2]]);const aB=A.reduce((s,r)=>s+r[1],0),aM=A.reduce((s,r)=>s+r[3],0);const lB=L.reduce((s,r)=>s+r[1],0),lM=L.reduce((s,r)=>s+r[3],0);const navB=aB-lB,navM=aM-lM,navps=navM*1e6/p.shares;const adj=Math.round(navps*(1+p.discount/100));return{A,L,aB,aM,lB,lM,navB,navM,navps,adj};}

  const methodology=`<p>현금흐름할인법(DCF; Discounted Cash Flow)은 수익접근법(Income Approach)에 속하는 평가방법으로, 기업이 미래에 창출할 잉여현금흐름(FCFF)을 가중평균자본비용(WACC)으로 할인하여 영업가치를 산정하고, 여기에 비영업자산을 가산하고 이자부부채를 차감하여 주주가치를 도출한다. 기업의 미래 수익창출능력을 직접 반영하므로 계속기업(Going-concern) 가치를 가장 잘 설명하는 방법으로 평가 실무에서 널리 사용된다.</p>
   <h4>가. 잉여현금흐름(FCFF) 산정</h4><p>FCFF는 영업이익(EBIT)에서 법인세를 차감한 세후영업이익(NOPAT)에 비현금비용인 감가상각비를 가산하고, 자본적지출(CAPEX)과 운전자본 증감을 차감하여 산정한다.</p>
   <h4>나. 할인율(WACC) 산정</h4><p>WACC는 자기자본비용(CAPM)과 세후 타인자본비용을 자본구조 비중으로 가중평균하여 산정한다.</p>
   ${tbl(['항목','값'],

  const results=`<h4>1. 예측기간 FCFF 현재가치</h4>${tbl(['연도','FCFF','할인계수','현재가치'],r.rows.map(x=>`<tr><td>${x.y}년차</td><td>${M(x.fcff)}</td><td>${x.df.toFixed(4)}</td><td>${M(x.pv)}</td></tr>`).join('')+`<tr><td>Terminal</td><td>${M(r.tv)}</td><td>${(1/Math.pow(1+r.wacc,5)).toFixed(4)}</td><td>${M(r.pvTv)}</td></tr>`)}

   <h4>2. 기업가치 산출</h4><table class="kv"><tr><td>예측기간 FCFF 현재가치 합계</td><td>${won(r.pvSum)}</td></tr><tr><td>영구가치(TV) 현재가치</td><td>${won(r.pvTv)}</td></tr><tr class="total"><td>영업가치</td><td>${won(r.op)}</td></tr><tr><td>(+) 비영업자산</td><td>${won(p.nonOp)}</td></tr><tr class="total"><td>기업가치</td><td>${won(r.ev)}</td></tr><tr><td>(-) 이자부부채</td><td>${won(p.debt)}</td></tr><tr class="total"><td>주주가치</td><td>${won(r.eq)}</td></tr><tr><td>발행주식수</td><td>${M(p.shares)}주</td></tr><tr class="total"><td>1주당 가치</td><td>${won(r.ps)}</td></tr></table>`;
  const ws=[r.wacc-0.005,r.wacc,r.wacc+0.005],gs=[r.tg-0.005,r.tg,r.tg+0.005],lastF=r.rows[4].fcff;
  const sens=(w,g)=>{let pv=0;for(let i=0;i<5;i++)pv+=r.rows[i].fcff/Math.pow(1+w,i+1);const tv=lastF*(1+g)/(w-g),ptv=tv/Math.pow(1+w,5);return Math.round((pv+ptv+p.nonOp-p.debt)/p.shares);};
  const sensitivity=`<p>핵심 변수인 할인율(WACC)과 영구성장률(g)의 변동에 따른 1주당 가치 민감도는 다음과 같다. (단위: 원)</p>${tbl(['WACC \\ g',...gs.map(g=>pct(g*100))],ws.map(w=>`<tr><td>${pct(w*100)}</td>${gs.map(g=>`<td${(Math.abs(w-r.wacc)<1e-9&&Math.abs(g-r.tg)<1e-9)?' style="background:#EEF2FF;font-weight:700;color:#1D4ED8"':''}>${won(sens(w,g))}</td>`).join('')}</tr>`).join(''))}`;
  const conclusion=`<p>${s.co.name}의 ${s.baseDate} 기준 기업가치를 현금흐름할인법으로 평가한 결과, <b>주주가치 ${won(r.eq)}</b>, <b>1주당 ${won(r.ps)}</b>으로 산정되었다. 본 평가액은 회사가 제시한 사업계획(5개년 매출 연평균 성장 및 영업이익률 개선)의 달성을 전제로 하며, WACC ${pct(r.wacc*100)} 및 영구성장률 ${pct(p.tg)}의 변동에 민감하다. 상기 민감도 분석 결과 1주당 가치는 ${won(sens(ws[0],gs[0]))} ~ ${won(sens(ws[2],gs[2]))}의 범위에서 변동할 수 있다.</p>`;
  return {summary,overview:overviewSection(s),company:companySection(s),financial,methodology,results,sensitivity,conclusion,appendix:APPENDIX};
 },
 tax(s){const p=s.inp,r=computeTax(p);

  const methodology=`<p>상속세 및 증여세법 시행령 제54조에 따른 비상장주식 평가는 <b>1주당 순손익가치</b>와 <b>1주당 순자산가치</b>를 가중평균하여 산정한다. 이는 기업의 수익력(순손익)과 자산보유 실질(순자산)을 함께 반영하기 위함이다.</p>

   <h4>다. 가중평균 및 하한</h4><p>일반법인은 순손익가치와 순자산가치를 3:2로, 부동산과다보유법인은 2:3으로 가중평균한다. 단, 가중평균액이 1주당 순자산가치의 80%에 미달하는 경우 그 80%를 평가액으로 한다(시행령 제54조 제1항 단서).</p>
   ${tbl(['항목','값'],`<tr><td>법인 구분</td><td>${p.general?'일반법인 (3:2)':'부동산과다보유법인 (2:3)'}</td></tr><tr><td>순손익가치 환원율</td><td>${pct(p.disc)}</td></tr><tr><td>1주당 순손익가치</td><td>${won(r.profitPS)}</td></tr><tr><td>1주당 순자산가치</td><td>${won(r.assetPS)}</td></tr><tr class="total"><td>순자산 80% 하한</td><td>${won(r.floor)}</td></tr>`)}`;

 intrinsic(s){const p=s.inp,r=computeIntrinsic(p);

 },
 asset(s){const p=s.inp,r=computeAsset(p);const rowsT=rows=>rows.map(x=>`<tr><td>${x[0]}</td><td>${M(x[1])}</td><td>${M(x[2])}</td><td>${M(x[3])}</td></tr>`).join('');
  const summary=`<div class="cards"><div class="card"><div class="l">장부 순자산</div><div class="v">${M(r.navB)}백만</div></div><div class="card"><div class="l">시가 조정액</div><div class="v">${M((r.aM-r.aB)-(r.lM-r.lB))}백만</div></div><div class="card"><div class="l">시가 순자산</div><div class="v">${M(r.navM)}백만</div></div><div class="card hl"><div class="l">조정 후 주당가치</div><div class="v">${won(r.adj)}</div></div></div>
   <p>순자산가치법(자산접근법, 공정가치법)에 따라 ${s.co.name}의 자산·부채를 시가로 재평가한 결과, 시가 순자산가치는 <b>${M(r.navM)}백만원</b>, 할인/할증 ${p.discount}% 적용 후 <b>1주당 ${won(r.adj)}</b>으로 산정되었다.</p>`;
  const financial=financialSection(s,`<h4>4. 자산·부채 시가 재평가 (단위: 백만원)</h4>${tbl(['자산','장부가액','시가조정','시가'],rowsT(r.A)+`<tr class="total"><td>자산 합계</td><td>${M(r.aB)}</td><td>${M(r.aM-r.aB)}</td><td>${M(r.aM)}</td></tr>`)}${tbl(['부채','장부가액','시가조정','시가'],rowsT(r.L)+`<tr class="total"><td>부채 합계</td><td>${M(r.lB)}</td><td>${M(r.lM-r.lB)}</td><td>${M(r.lM)}</td></tr>`)}`);
  const methodology=`<p>순자산가치법(Net Asset Value Method)은 자산접근법(Asset Approach)에 속하며, 평가대상회사가 보유한 총자산에서 총부채를 차감한 순자산가치를 기업가치로 산정한다. 본 평가는 그 중 공정가치법(Fair Value)을 적용하였다.</p>
   <h4>가. 평가 절차</h4><ul class="bul"><li>① 평가기준일 재무상태표 입수</li><li>② 취득원가로 기록된 자산·부채를 공정가치(시가)로 조정 (특히 부동산은 감정평가 반영)</li><li>③ 누락·부외 자산·부채 반영</li><li>④ 시가 총자산 - 시가 총부채 = 시가 순자산가치</li><li>⑤ 순자산가치 ÷ 발행주식수 = 1주당 가치</li></ul>
   <h4>나. 장단점</h4><p>객관적이고 이해가 쉬우나, 미래 수익창출능력이 반영되지 않는 한계가 있어 자산보유형·청산가정 기업에 적합하다.</p>`;
  const results=`<table class="kv"><tr><td>시가 총자산</td><td>${M(r.aM)} 백만원</td></tr><tr><td>시가 총부채</td><td>${M(r.lM)} 백만원</td></tr><tr class="total"><td>시가 순자산가치(NAV)</td><td>${M(r.navM)} 백만원</td></tr><tr><td>발행주식수</td><td>${M(p.shares)}주</td></tr><tr><td>조정 전 1주당 가치</td><td>${won(r.navps)}</td></tr><tr><td>할인/할증율</td><td>${p.discount}%</td></tr><tr class="total"><td>조정 후 1주당 가치</td><td>${won(r.adj)}</td></tr></table>`;
  const sensitivity=`<p>할인/할증율 변동에 따른 1주당 가치 민감도는 다음과 같다.</p>${tbl(['할인/할증율',...[-20,-10,0,10].map(d=>d+'%')],`<tr><td>주당가치</td>${[-20,-10,0,10].map(d=>`<td>${won(Math.round(r.navps*(1+d/100)))}</td>`).join('')}</tr>`)}`;
  const conclusion=`<p>${s.co.name}의 1주당 가치는 순자산가치법에 따라 시가 순자산 ${M(r.navM)}백만원을 기준으로 할인율 ${p.discount}% 적용 후 <b>${won(r.adj)}</b>으로 평가되었다. 보유 부동산의 시가 상승으로 시가 순자산이 장부 순자산(${M(r.navB)}백만원)을 상회하였다.</p>`;
  return {summary,overview:overviewSection(s),company:companySection(s),financial,methodology,results,sensitivity,conclusion,appendix:APPENDIX};
 },
};

// ===== 구조화: 계산기 라이브 입력 수신 (하드코딩 X) =====
// 계산기의 "보고서 생성" 버튼이 sessionStorage에 모든 입력 필드값(id→value)을 저장 → 여기서 inp로 매핑
const FIELD_MAP={
 dcf:f=>({shares:+f.sharesOutstanding||+f['shares-outstanding'],rf:+f.riskFreeRate,mrp:+f.marketRiskPremium,beta:+f.leveredBeta,sizeP:+f.sizePremium,kd:+f.costOfDebt,tax:+f.taxRate,eW:+f.equityRatio,dW:+f.debtRatio,tg:+f.terminalGrowth,nonOp:+f.nonOperatingAssets||0,debt:+f.interestBearingDebt||0,
   rev:[1,2,3,4,5].map(i=>+f['revenue'+i]||0),ebit:[1,2,3,4,5].map(i=>+f['ebit'+i]||0),dep:[1,2,3,4,5].map(i=>+f['dep'+i]||0),capex:[1,2,3,4,5].map(i=>+f['capex'+i]||0),wc:[1,2,3,4,5].map(i=>+f['wc'+i]||0)}),
 tax:f=>({shares:+(f['shares-outstanding']||'').toString().replace(/,/g,''),disc:+f['discount-rate'],income:[+f['income-1'],+f['income-2'],+f['income-3']],nontax:[+f['nontax-1']||0,+f['nontax-2']||0,+f['nontax-3']||0],tax:[+f['tax-1']||0,+f['tax-2']||0,+f['tax-3']||0],assets:+f['total-assets'],liab:+f['total-liabilities'],general:true}),
 intrinsic:f=>({shares:+f['total-shares'],cap:+f['capitalization-rate'],nav:+f['nav-value'],income:[+f['income-year1'],+f['income-year2'],+f['income-year3']]}),
 relative:f=>({shares:+(f['shares-outstanding']||'').toString().replace(/,/g,''),ni:+(f['net-income']||'').toString().replace(/,/g,''),eq:+(f.equity||'').toString().replace(/,/g,''),rev:+(f.revenue||'').toString().replace(/,/g,''),ebitda:+(f.ebitda||'').toString().replace(/,/g,''),netDebt:+(f['net-debt']||'').toString().replace(/,/g,''),wPer:+f['weight-per'],wPbr:+f['weight-pbr'],wEvEbitda:+f['weight-ev-ebitda'],liq:+f['liquidity-discount']||0,peers:SAMPLE.relative.inp.peers}),
 asset:f=>{const cv=k=>+(f[k]||'0').toString().replace(/,/g,'');const A=[['현금및현금성자산','cash'],['매출채권','ar'],['재고자산','inventory'],['투자자산','investment'],['토지','land'],['건물','building'],['기계장치','equipment'],['무형자산','intangible']].map(([n,k])=>[n,cv(k+'-book'),cv(k+'-adj')]).filter(r=>r[1]||r[2]);const L=[['매입채무','ap'],['단기차입금','short-debt'],['장기차입금','long-debt'],['퇴직급여충당부채','pension']].map(([n,k])=>[n,cv(k+'-book'),cv(k+'-adj')]).filter(r=>r[1]||r[2]);return{shares:cv('shares-outstanding'),discount:+f['nav-discount']||0,assets:A.length?A:SAMPLE.asset.inp.assets,liabs:L.length?L:SAMPLE.asset.inp.liabs};},
};
function ingestLive(method){
 try{const raw=localStorage.getItem('vl_report_fields_'+method);if(!raw)return null;
  const f=JSON.parse(raw);const inp=FIELD_MAP[method](f);
  // 유효성: 핵심값 없으면 무시(샘플 사용)
  if(!inp||!inp.shares||isNaN(inp.shares))return null;
  const name=(f.companyName||f['company-name']||'').trim();
  return {inp,name};
 }catch(e){return null;}
}
// ===== 차트 (SVG, 라이브러리 없이) =====
function barChart(items,unit){
 const max=Math.max(...items.map(i=>Math.abs(i.v)),1),W=620,H=180,bw=W/items.length*0.55,gap=W/items.length;
 const bars=items.map((it,i)=>{const h=Math.abs(it.v)/max*120;const x=gap*i+gap*0.22;const y=it.v>=0?(140-h):140;
  return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${it.c||'#1D4ED8'}"/>
   <text x="${x+bw/2}" y="${it.v>=0?y-5:y+h+13}" font-size="11" fill="#374151" text-anchor="middle">${it.label}</text>
   <text x="${x+bw/2}" y="160" font-size="10" fill="#6B7280" text-anchor="middle">${it.name}</text>`;}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin:10px 0;"><line x1="0" y1="140" x2="${W}" y2="140" stroke="#E5E7EB"/>${bars}<text x="0" y="14" font-size="10" fill="#9CA3AF">단위: ${unit}</text></svg>`;
}

const SEC=[['summary','요약 (Executive Summary)'],['overview','평가 개요'],['company','회사 개요 및 산업 분석'],['financial','재무 분석'],['methodology','평가 방법론 및 가정'],['results','평가 결과'],['sensitivity','민감도 분석'],['conclusion','결론'],['appendix','부록 — 면책 및 주의사항']];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX'];

function render(method){
 let s=SAMPLE[method];
 const live=ingestLive(method);
 if(live){ // 구조화: 계산기 실입력값으로 덮어쓰기 (프로필·산업분석·과거재무는 의뢰인 제공 자료 또는 업종 템플릿 사용)
   s={...s,co:{...s.co,name:live.name||s.co.name},inp:{...s.inp,...live.inp}};
   s._live=true;
 }
 const c=GEN[method](s);
 const toc=SEC.map((t,i)=>`<li><b>${ROMAN[i]}.</b>${t[1]}</li>`).join('');
 const secs=SEC.map((t,i)=>`<section><div class="sh"><div class="n">${ROMAN[i]}</div><h2>${t[1]}</h2></div>${c[t[0]]}</section>`).join('');
 document.getElementById('doc').innerHTML=`
  <div class="cover"><div class="logo">VALUELINK</div><div class="ttl">기업가치 평가보고서</div><div class="method">${s.full}</div><div class="co">${s.co.name}</div>
   <div class="meta"><div><b>평가기준일</b>${s.baseDate}</div><div><b>평가기관</b>ValueLink</div><div><b>작성일</b>${today()}</div><div><b>평가방법</b>${s.full.split(' ')[0]}</div></div>
   <div class="rno">Report No. VL-${method.toUpperCase()}-${new Date().getFullYear()}</div></div>
  <div class="opinion"><h2>평가 의견서</h2>
   <p>당 평가기관(ValueLink)은 ${s.co.name}(이하 "평가대상회사")와 체결한 용역계약에 따라, 평가대상회사의 ${s.baseDate}(이하 "평가기준일") 현재 기업가치를 ${s.full}으로 평가하여 그 결과를 보고합니다.</p>
   <p>본 보고서는 평가대상회사 및 의뢰인이 제공한 산업정보·경영정보·재무정보에 기초한 것으로, 당 평가기관은 제시된 자료의 완전성에 대하여 책임을 부담하지 아니합니다. 본 보고서에 포함된 미래 추정정보에는 향후 사업계획 및 현금흐름에 대한 일정한 가정이 포함되어 있으며, 거시경제지표 변동 등 예상하지 못한 요인에 의해 실제 결과와 일치하지 않을 수 있습니다.</p>
   <p>본 보고서는 기업가치 평가 목적으로 작성된 것이므로 그 외의 목적으로 이용될 수 없으며, 당 평가기관의 사전승인 없이 제3자에게 제공되거나 인용될 수 없습니다.</p>
   <div class="sign">${today()}<br><b>ValueLink 자동평가엔진</b></div></div>
  <div class="body"><div class="toc"><h3>목 차</h3><ul>${toc}</ul></div>${secs}</div>`;
 window.scrollTo(0,0);
}
const params=new URLSearchParams(location.search);
const initMethod=(params.get('method')&&SAMPLE[params.get('method')])?params.get('method'):'dcf';
document.getElementById('methodSel').value=initMethod;
document.getElementById('methodSel').addEventListener('change',e=>render(e.target.value));
render(initMethod);
</script>
