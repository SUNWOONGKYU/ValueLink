<body>
<div class="toolbar">

<script>
// ===== 유틸 =====
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const eok = n => (n/1e8).toFixed(1) + '억원';
const M = n => n.toLocaleString('ko-KR');           // 백만원 그대로
const pct = n => n.toFixed(2) + '%';
const today = () => { const d=new Date(); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };

// ===== 샘플 회사 + 입력 =====
const SAMPLE = {
  dcf: {
    full:'DCF평가법 (현금흐름할인법)',
    co:{name:'넥스트클라우드 주식회사', founded:'2018년 3월 12일', ceo:'김도현', addr:'경기도 성남시 분당구 판교역로 235',
        emp:'82명', biz:'클라우드 기반 B2B SaaS 솔루션 개발·공급', industry:'응용 소프트웨어 개발 및 공급업',
        holders:[['김도현','대표이사','38.5%'],['에이스벤처스','FI','22.0%'],['우리사주조합','임직원','9.5%'],['기타','-','30.0%']]},
    baseDate:'2026년 6월 30일',
    inp:{shares:10000000,rf:3.5,mrp:7.0,beta:1.3,sizeP:2.0,kd:5.0,tax:22.0,eW:80,dW:20,tg:2.5,
      nonOp:5000000000,debt:3000000000,
      rev:[34000000000,44000000000,53000000000,60000000000,66000000000],
      ebit:[6000000000,7800000000,9500000000,11000000000,12000000000],
      dep:[600000000,750000000,900000000,1000000000,1100000000],
      capex:[900000000,1100000000,1300000000,1400000000,1500000000],
      wc:[500000000,550000000,600000000,500000000,400000000]},
  },
  tax: {
    full:'상증세법평가법 (상속세 및 증여세법 제54조)',
    co:{name:'한울푸드 주식회사', founded:'2009년 7월 1일', ceo:'박상우', addr:'충청북도 청주시 흥덕구 산단로 58',
        emp:'45명', biz:'전통식품 제조·가공 및 유통', industry:'기타 식품 제조업',
        holders:[['박상우','대표이사','55.0%'],['박지민','특수관계인','20.0%'],['한울홀딩스','법인','15.0%'],['기타','-','10.0%']]},
    baseDate:'2026년 6월 30일',
    inp:{shares:200000,disc:10,income:[1800,1500,1200],nontax:[0,0,0],tax:[0,0,0],assets:9000,liab:3500,general:true},
  },
  intrinsic: {
    full:'본질가치평가법 (자본시장법)',
    co:{name:'메디코어 주식회사', founded:'2015년 11월 9일', ceo:'정수민', addr:'서울특별시 강서구 마곡중앙로 161-8',
        emp:'120명', biz:'의료기기 연구개발·제조 (AI 진단 솔루션)', industry:'의료용 기기 제조업',
        holders:[['정수민','대표이사','30.2%'],['바이오넥스트','FI','25.8%'],['전략적투자자(SI)','법인','18.0%'],['기타','-','26.0%']]},
    baseDate:'2026년 6월 30일',
    inp:{shares:2000000,cap:10,nav:45000,income:[6000,5200,4500]},
  },
  relative: {
    full:'상대가치평가법 (유사기업비교법)',
    co:{name:'핀테크원 주식회사', founded:'2017년 2월 20일', ceo:'이재훈', addr:'서울특별시 영등포구 여의대로 108',
        emp:'95명', biz:'간편결제·금융 데이터 플랫폼', industry:'그 외 기타 정보 서비스업',
        holders:[['이재훈','대표이사','28.0%'],['캐피탈원','FI','24.0%'],['핀테크파트너스','FI','18.0%'],['기타','-','30.0%']]},
    baseDate:'2026년 6월 30일',
    inp:{shares:8000000,ni:4500,eq:42000,rev:38000,ebitda:6800,netDebt:2000,
      wPer:40,wPbr:30,wEvEbitda:30,liq:20,
      peers:[['핀크코리아',24.3,2.7,3.0,16.7],['데이터블',25.7,2.9,3.3,17.9],['와이즈핀',22.6,2.4,2.7,15.1]]},
  },
  asset: {
    full:'자산가치평가법 (순자산가치법)',
    co:{name:'대한실업 주식회사', founded:'1998년 5월 4일', ceo:'최영호', addr:'부산광역시 강서구 녹산산업중로 333',
        emp:'60명', biz:'부동산 임대 및 제조설비 운영', industry:'기타 부동산 임대업',
        holders:[['최영호','대표이사','60.0%'],['대한홀딩스','법인','25.0%'],['기타','-','15.0%']]},
    baseDate:'2026년 6월 30일',
    inp:{shares:5000000,discount:-10,
      assets:[['현금및현금성자산',4000,0],['매출채권',6000,-300],['재고자산',5000,-600],['토지',20000,12000],['건물',9000,1500],['기계장치',4000,-800]],
      liabs:[['매입채무',5000,0],['단기차입금',7000,0],['장기차입금',12000,0]]},
  },
};

// ===== 계산 =====
function computeDCF(p){
  const ke = p.rf/100 + p.beta*p.mrp/100 + p.sizeP/100;
  const kdAt = p.kd/100*(1-p.tax/100);
  const sum=p.eW+p.dW, eW=p.eW/sum, dW=p.dW/sum;
  const wacc = eW*ke + dW*kdAt;
  const tg=p.tg/100;
  const rows=[]; let pvSum=0,fcff=0;
  for(let i=0;i<5;i++){
    const nopat=p.ebit[i]*(1-p.tax/100);
    fcff=nopat+p.dep[i]-p.capex[i]-p.wc[i];
    const df=1/Math.pow(1+wacc,i+1); const pv=fcff*df;
    pvSum+=pv; rows.push({y:i+1,fcff,df,pv});
  }
  const tFcff=fcff*(1+tg), tv=tFcff/(wacc-tg), pvTv=tv/Math.pow(1+wacc,5);
  const op=pvSum+pvTv, ev=op+p.nonOp, eq=ev-p.debt, ps=eq/p.shares;
  return {ke,kdAt,eW,dW,wacc,tg,rows,tv,pvTv,pvSum,op,ev,eq,ps};
}
function computeTax(p){
  const w=(p.income[2]+p.nontax[2]-p.tax[2])*1+(p.income[1]+p.nontax[1]-p.tax[1])*2+(p.income[0]+p.nontax[0]-p.tax[0])*3;
  const weighted=Math.max(0,w/6);
  const dr=p.disc/100;
  const profitPS=(weighted*1e6/dr)/p.shares;
  const net=p.assets-p.liab; const assetPS=net*1e6/p.shares;
  let fin=Math.floor((profitPS*(p.general?3:2)+assetPS*(p.general?2:3))/5);
  const floor=assetPS*0.8, floored=fin<floor; if(floored)fin=Math.floor(floor);
  return {weighted,profitPS,assetPS,net,fin,floor,floored};
}
function computeIntrinsic(p){
  const avg=(p.income[0]+p.income[1]+p.income[2])/3;
  const incomeVal=Math.max(0,avg)/(p.cap/100);
  const psInc=incomeVal*1e6/p.shares, psAsset=p.nav*1e6/p.shares;
  const intrinsic=Math.round((psAsset*1+psInc*1.5)/2.5);
  return {avg,incomeVal,psInc,psAsset,intrinsic};
}
function computeRelative(p){
  const m1=a=>parseFloat((a.reduce((x,y)=>x+y,0)/a.length).toFixed(1));
  const avgPer=m1(p.peers.map(r=>r[1])), avgPbr=m1(p.peers.map(r=>r[2])), avgEv=m1(p.peers.map(r=>r[4]));
  const ps=mc=>Math.round(mc*1e6/p.shares);
  const perPS=ps(p.ni*avgPer), pbrPS=ps(p.eq*avgPbr), evPS=ps(p.ebitda*avgEv-p.netDebt);
  const weighted=perPS*p.wPer/100+pbrPS*p.wPbr/100+evPS*p.wEvEbitda/100;
  const liq=Math.min(Math.max(p.liq,0),50)/100;
  const disc=Math.round(weighted*(1-liq));
  return {avgPer,avgPbr,avgEv,perPS,pbrPS,evPS,weighted:Math.round(weighted),disc,liq};
}
function computeAsset(p){
  const A=p.assets.map(r=>[r[0],r[1],r[2],r[1]+r[2]]);
  const L=p.liabs.map(r=>[r[0],r[1],r[2],r[1]+r[2]]);
  const aB=A.reduce((s,r)=>s+r[1],0), aM=A.reduce((s,r)=>s+r[3],0);
  const lB=L.reduce((s,r)=>s+r[1],0), lM=L.reduce((s,r)=>s+r[3],0);
  const navB=aB-lB, navM=aM-lM, navps=navM*1e6/p.shares;
  const adj=Math.round(navps*(1+p.discount/100));
  return {A,L,aB,aM,lB,lM,navB,navM,navps,adj};
}

// ===== 공통 섹션 =====
function coShareTable(co){
  return `<table><thead><tr><th>주주명</th><th>구분</th><th>지분율</th></tr></thead><tbody>${
    co.holders.map(h=>`<tr><td>${h[0]}</td><td style="text-align:center">${h[1]}</td><td>${h[2]}</td></tr>`).join('')}</tbody></table>`;
}
function companySection(co){
  return `<table class="kv">
    <tr><td>회사명</td><td>${co.name}</td></tr>
    <tr><td>설립일</td><td>${co.founded}</td></tr>
    <tr><td>대표이사</td><td>${co.ceo}</td></tr>
    <tr><td>본점 소재지</td><td>${co.addr}</td></tr>
    <tr><td>임직원 수</td><td>${co.emp}</td></tr>
    <tr><td>주요 사업</td><td>${co.biz}</td></tr>
    <tr><td>표준산업분류</td><td>${co.industry}</td></tr></table>
    <p style="margin-top:14px"><b>주주 현황</b></p>${coShareTable(co)}`;
}
function overviewSection(s, methodName){
  return `<table class="kv">
    <tr><td>용역의 목적</td><td>${s.baseDate} 현재 ${s.co.name}의 기업가치 평가</td></tr>
    <tr><td>평가 방법</td><td>${methodName}</td></tr>
    <tr><td>평가 기준일</td><td>${s.baseDate}</td></tr>
    <tr><td>평가 기관</td><td>ValueLink</td></tr>
    <tr><td>작성일</td><td>${today()}</td></tr></table>
    <p><b>주요 가정</b></p>
    <p>• 본 평가는 평가대상회사가 제시한 재무자료 및 사업계획을 기초로 하였습니다.<br>
    • 평가기준일 현재의 시장환경 및 가용정보를 반영하였으며, 향후 거시경제 변동 등에 따라 결과가 달라질 수 있습니다.<br>
    • 본 보고서는 기업가치 평가 목적으로만 사용되어야 하며, 그 외 목적의 이용에 대해 평가기관은 책임을 부담하지 않습니다.</p>`;
}
const APPENDIX = `<div class="disc">본 보고서는 의뢰인이 제공한 자료와 공개 정보를 기초로 ValueLink 자동평가엔진이 작성하였으며, 제공된 자료의 정확성·완전성에 대한 책임은 의뢰인에게 있습니다. 본 평가 결과는 평가기준일 현재의 시장 상황과 가용 정보를 기반으로 한 추정치로서, 특정 거래의 권유나 투자 조언을 목적으로 하지 않습니다. 실제 거래가격은 협상·시장상황에 따라 본 평가액과 다를 수 있습니다.</div>`;

// ===== 방법별 섹션 =====
const GEN = {
  dcf(s){ const p=s.inp, r=computeDCF(p);
    const summary=`<div class="cards">
      <div class="card"><div class="l">영업가치</div><div class="v">${eok(r.op)}</div></div>
      <div class="card"><div class="l">기업가치</div><div class="v">${eok(r.ev)}</div></div>
      <div class="card"><div class="l">주식가치</div><div class="v">${eok(r.eq)}</div></div>
      <div class="card hl"><div class="l">주당가치</div><div class="v">${won(r.ps)}</div></div></div>
      <p>${s.co.name}의 ${s.baseDate} 기준 기업가치를 현금흐름할인법(DCF)으로 평가한 결과, 주주가치는 <b>${eok(r.eq)}</b>, 발행주식수 ${M(p.shares)}주 기준 <b>주당 ${won(r.ps)}</b>으로 산정되었습니다.</p>`;
    const financial=`<p>평가대상회사 사업계획에 기초한 5개년 추정 잉여현금흐름(FCFF)은 다음과 같습니다. (단위: 원)</p>
      <table><thead><tr><th>구분</th>${[1,2,3,4,5].map(y=>`<th>${y}년차</th>`).join('')}</tr></thead><tbody>
      <tr><td>매출액</td>${p.rev.map(v=>`<td>${M(v)}</td>`).join('')}</tr>
      <tr><td>EBIT</td>${p.ebit.map(v=>`<td>${M(v)}</td>`).join('')}</tr>
      <tr><td>(+) 감가상각비</td>${p.dep.map(v=>`<td>${M(v)}</td>`).join('')}</tr>
      <tr><td>(-) CAPEX</td>${p.capex.map(v=>`<td>${M(v)}</td>`).join('')}</tr>
      <tr><td>(-) 운전자본증감</td>${p.wc.map(v=>`<td>${M(v)}</td>`).join('')}</tr>
      <tr class="total"><td>FCFF</td>${r.rows.map(x=>`<td>${M(Math.round(x.fcff))}</td>`).join('')}</tr></tbody></table>`;
    const methodology=`<p>현금흐름할인법(DCF)은 기업이 미래에 창출할 잉여현금흐름을 가중평균자본비용(WACC)으로 할인하여 현재가치를 산정하는 방법입니다. WACC는 자본자산가격결정모형(CAPM)으로 산정한 자기자본비용과 세후 타인자본비용을 자본구조 비중으로 가중평균하여 산출합니다.</p>
      <table class="kv">
      <tr><td>무위험이자율(Rf)</td><td>${pct(p.rf)}</td></tr>

      <tr><td>베타(β)</td><td>${p.beta.toFixed(2)}</td></tr>
      <tr><td>규모프리미엄</td><td>${pct(p.sizeP)}</td></tr>
      <tr><td>자기자본비용(Ke)=Rf+β·MRP+규모P</td><td><b>${pct(r.ke*100)}</b></td></tr>
      <tr><td>세전 타인자본비용(Kd)</td><td>${pct(p.kd)}</td></tr>
      <tr><td>세후 타인자본비용=Kd·(1-t)</td><td>${pct(r.kdAt*100)}</td></tr>
      <tr><td>자본구조(자기:타인)</td><td>${p.eW}% : ${p.dW}%</td></tr>

    const results=`<table><thead><tr><th>연도</th><th>FCFF</th><th>할인계수</th><th>현재가치</th></tr></thead><tbody>
      ${r.rows.map(x=>`<tr><td>${x.y}년차</td><td>${M(Math.round(x.fcff))}</td><td>${x.df.toFixed(4)}</td><td>${M(Math.round(x.pv))}</td></tr>`).join('')}
      <tr><td>Terminal</td><td>${M(Math.round(r.tv))}</td><td>${(1/Math.pow(1+r.wacc,5)).toFixed(4)}</td><td>${M(Math.round(r.pvTv))}</td></tr></tbody></table>

      <tr><td><b>영업가치</b></td><td><b>${won(r.op)}</b></td></tr>
      <tr><td>(+) 비영업자산</td><td>${won(p.nonOp)}</td></tr>
      <tr><td><b>기업가치</b></td><td><b>${won(r.ev)}</b></td></tr>

      <tr><td>발행주식수</td><td>${M(p.shares)}주</td></tr>
      <tr><td><b>주당가치</b></td><td><b>${won(r.ps)}</b></td></tr></table>`;
    // 민감도: WACC ±0.5%p × g ±0.5%p

    const lastF=r.rows[4].fcff;
    const sens=(w,g)=>{let pv=0;for(let i=0;i<5;i++)pv+=r.rows[i].fcff/Math.pow(1+w,i+1);const tv=lastF*(1+g)/(w-g);const ptv=tv/Math.pow(1+w,5);return Math.round((pv+ptv+p.nonOp-p.debt)/p.shares);};

    return {summary,overview:overviewSection(s,s.full),company:companySection(s.co),financial,methodology,results,sensitivity,conclusion,appendix:APPENDIX};

      ${rowsT(r.A)}<tr class="total"><td>자산 합계</td><td>${M(r.aB)}</td><td>${M(r.aM-r.aB)}</td><td>${M(r.aM)}</td></tr></tbody></table>
      <table><thead><tr><th>부채</th><th>장부가액</th><th>시가조정</th><th>시가</th></tr></thead><tbody>
      ${rowsT(r.L)}<tr class="total"><td>부채 합계</td><td>${M(r.lB)}</td><td>${M(r.lM-r.lB)}</td><td>${M(r.lM)}</td></tr></tbody></table>`;
    const methodology=`<p>순자산가치법(NAV)은 평가대상회사의 자산과 부채를 평가기준일 현재의 공정가치(시가)로 재평가한 후, 시가 총자산에서 시가 총부채를 차감하여 순자산가치를 산정하고 이를 발행주식수로 나누어 1주당 가치를 계산합니다. 비상장·소수지분의 경우 할인을, 지배지분의 경우 할증을 적용할 수 있습니다.</p>`;
    const results=`<table class="kv">
      <tr><td>시가 총자산</td><td>${M(r.aM)} 백만원</td></tr>
      <tr><td>시가 총부채</td><td>${M(r.lM)} 백만원</td></tr>
      <tr><td><b>시가 순자산가치(NAV)</b></td><td><b>${M(r.navM)} 백만원</b></td></tr>
      <tr><td>발행주식수</td><td>${M(p.shares)}주</td></tr>
      <tr><td>조정 전 1주당 가치</td><td>${won(r.navps)}</td></tr>
      <tr><td>할인/할증율</td><td>${p.discount}%</td></tr>
      <tr class="total"><td>조정 후 1주당 가치</td><td>${won(r.adj)}</td></tr></table>`;
    const sensitivity=`<p>할인/할증율 변동에 따른 주당가치 민감도입니다.</p>
      <table><thead><tr><th>할인/할증율</th>${[-20,-10,0,10].map(d=>`<th>${d}%</th>`).join('')}</tr></thead><tbody>
      <tr><td>주당가치</td>${[-20,-10,0,10].map(d=>`<td>${won(Math.round(r.navps*(1+d/100)))}</td>`).join('')}</tr></tbody></table>`;
    const conclusion=`<p>${s.co.name}의 1주당 가치는 순자산가치법에 따라 시가 순자산 ${M(r.navM)}백만원을 기준으로, 할인율 ${p.discount}% 적용 후 <b>${won(r.adj)}</b>으로 평가되었습니다.</p>`;
    return {summary,overview:overviewSection(s,s.full),company:companySection(s.co),financial,methodology,results,sensitivity,conclusion,appendix:APPENDIX};
  },
};

const SEC_TITLES=[['summary','요약 (Executive Summary)'],['overview','평가 개요'],['company','회사 개요 및 주주 현황'],
  ['financial','재무 분석'],['methodology','평가 방법론 및 가정'],['results','평가 결과'],['sensitivity','민감도 분석'],
  ['conclusion','결론'],['appendix','부록 — 면책 및 주의사항']];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX'];

function render(method){
  const s=SAMPLE[method]; const c=GEN[method](s);
  let toc=SEC_TITLES.map((t,i)=>`<li><b>${ROMAN[i]}.</b>${t[1]}</li>`).join('');
  let secs=SEC_TITLES.map((t,i)=>`<section><div class="sh"><div class="n">${ROMAN[i]}</div><h2>${t[1]}</h2></div>${c[t[0]]}</section>`).join('');
  document.getElementById('doc').innerHTML=`
    <div class="cover">
      <div class="logo">VALUELINK</div>
      <div class="ttl">기업가치 평가보고서</div>
      <div class="method">${s.full}</div>
      <div class="co">${s.co.name}</div>
      <div class="meta">
        <div><b>평가기준일</b>${s.baseDate}</div><div><b>평가기관</b>ValueLink</div>
        <div><b>작성일</b>${today()}</div><div><b>평가방법</b>${s.full.split(' ')[0]}</div>
      </div>
      <div class="rno">Report No. VL-${method.toUpperCase()}-${new Date().getFullYear()}</div>
    </div>
    <div class="body">
      <div class="toc"><h3>목 차</h3><ul>${toc}</ul></div>
      ${secs}
    </div>`;
  window.scrollTo(0,0);
}

const params=new URLSearchParams(location.search);
const initMethod=params.get('method')&&SAMPLE[params.get('method')]?params.get('method'):'dcf';
document.getElementById('methodSel').value=initMethod;
document.getElementById('methodSel').addEventListener('change',e=>render(e.target.value));
render(initMethod);
</script>
</body>
</html>
