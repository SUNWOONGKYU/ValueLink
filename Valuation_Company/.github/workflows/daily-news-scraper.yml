# ⛔ 비활성화됨 (2026-06-15)
# 이유: 운영 파이프라인은 Windows 작업 스케줄러(run_daily.bat → collect_naver_only.py)로 전환.
#       이 워크플로는 Gemini 기반 daily_auto_collect.py를 호출하여 현재 운영 방식(Naver 전용)과
#       불일치하며, Gemini API 키 없이는 실행 불가. 혼선 방지를 위해 trigger를 제거함.
#       파일은 참조용으로 보존. 재활성화 시 'on:' 블록을 복구하고 collect_naver_only.py로 교체할 것.
#
# name: Daily Investment News Scraper
#
# on:
#   schedule:
#     - cron: '0 21 * * *'
#   workflow_dispatch:
#     inputs:
#       target_date:
#         description: '수집 대상 날짜 (YYYY-MM-DD)'
#         required: false
#         default: ''

name: Daily Investment News Scraper (DISABLED)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '이 워크플로는 비활성화됨. 실행하지 마세요. (참고용 보존)'
        required: true
        default: 'DISABLED'

jobs:
  disabled-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "⛔ 이 워크플로는 비활성화됨."
          echo "운영 파이프라인: Windows 스케줄러 → run_daily.bat → collect_naver_only.py"
          echo "Gemini 기반 daily_auto_collect.py는 미운영 상태입니다."
          exit 1
